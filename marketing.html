      hubDb = createPageClient(__HUB_SUPABASE_URL, __HUB_SUPABASE_KEY, {

          Authorization: `Bearer ${session.access_token}`,
          "x-hub-ticket": __HUB_TICKET,
          "x-hub-page": __HUB_PAGE
        } },
        auth: { persistSession:false, autoRefreshToken:false, detectSessionInUrl:false }
      });
      const { data, error } = await hubDb.rpc("hub_ticket_profile", { p_page:__HUB_PAGE });
      if (error || !data?.ok || !data?.member || data.member.status !== "active") {
        __showHubOnly(data?.error || error?.message || "HUB 通行證無效、已過期或沒有此頁權限"); return false;
      }

    }

    // ─── 4. 工具與計算函式 ───
    function fmtTwd(n) { return new Intl.NumberFormat("zh-TW", { style: "currency", currency: "TWD", maximumFractionDigits: 0 }).format(Number(n || 0)); }
    function getDaysInMonth(year, month) { return new Date(year, month, 0).getDate(); }
    function parseISODateLocal(dateStr){
      const [y, m, d] = String(dateStr).split("-").map(Number);
      return new Date(y, m - 1, d || 1);
    }
    function toISODateLocal(dt){ return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`; }
    function addDays(dt, days){ const x = new Date(dt); x.setDate(x.getDate() + days); return x; }

    function getMajorMonth(isoDateStr) {
      const wkStart = parseISODateLocal(isoDateStr);
      const counts = new Map();
      for (let i = 0; i < 7; i++) {
        const x = addDays(wkStart, i);
        const key = `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}`;
        counts.set(key, (counts.get(key) || 0) + 1);
      }
      let bestKey = null, bestDays = -1;
      for (const [k, days] of counts.entries()) {
        if (days > bestDays) { bestDays = days; bestKey = k; continue; }
        if (days === bestDays && bestKey && k > bestKey) bestKey = k;
      }
      const [yy, mm] = String(bestKey).split("-");
      return { year: Number(yy), month: Number(mm), key: bestKey };
    }

    function updateRatioDisplay(val) {
      const linan = parseInt(val);
      dom.ratioDisplay.textContent = `${linan}% : ${100 - linan}%`;
    }

    function handleDateChangeToInherit() {
      if (dom.editExpenseId.value !== "") return;
      const val = Math.round(inheritRatio(parseInt(dom.inputYear.value), parseInt(dom.inputMonth.value)) * 100);
      dom.inputLinanRatio.value = val;
      updateRatioDisplay(val);
    }

    function inheritRatio(year, month) {
      let prevMonth = month - 1, prevYear = year;
      if (prevMonth === 0) { prevMonth = 12; prevYear = year - 1; }
      const exactMatch = allExpenses.find(e => e.year === prevYear && e.month === prevMonth);
      if (exactMatch && exactMatch.linan_ratio != null) return Number(exactMatch.linan_ratio);
      if (allExpenses.length > 0) {
        const sorted = [...allExpenses].sort((a,b) => (b.year * 12 + b.month) - (a.year * 12 + a.month));
        if (sorted[0] && sorted[0].linan_ratio != null) return Number(sorted[0].linan_ratio);
      }
      return 0.72;
    }

    function escMobile(v){

    function marketingMultiple(revenue, alloc){
      if(!alloc) return { text:'--', value:0, loss:false };
      const value = Number(revenue||0) / Number(alloc||1);
      return { text:`${Number(revenue||0) >= Number(alloc||0) ? '賺' : '賠'} ${value.toFixed(1)} 倍`, value, loss:Number(revenue||0) < Number(alloc||0) };

        const lm=marketingMultiple(latest.linan_amount,lAlloc),nm=marketingMultiple(latest.nanke_amount,nAlloc);
        latestWrap.innerHTML=`<div class="mkt-mobile-week"><div class="mkt-mobile-week-head"><span>${st.getMonth()+1}/${st.getDate()}–${en.getMonth()+1}/${en.getDate()}</span><span>最新</span></div><div class="mkt-mobile-store-result"><div><div class="mkt-mobile-store-name mkt-mobile-l">臨安店</div><div class="mkt-mobile-store-meta">業績 ${fmtTwd(latest.linan_amount)} · 投入 ${fmtTwd(lAlloc)}</div></div><div class="mkt-mobile-multiple ${lm.loss?'loss':''}">${lm.text}</div></div><div class="mkt-mobile-store-result"><div><div class="mkt-mobile-store-name mkt-mobile-n">南科店</div><div class="mkt-mobile-store-meta">業績 ${fmtTwd(latest.nanke_amount)} · 投入 ${fmtTwd(nAlloc)}</div></div><div class="mkt-mobile-multiple ${nm.loss?'loss':''}">${nm.text}</div></div></div>`;
      }
      const recent=globalRecentWeeks(4);
      if(!recent.length){trendWrap.innerHTML='<div class="mkt-mobile-sub">尚無可比較週資料。</div>';return;}
      const computed=recent.map(row=>{const major=getMajorMonth(row.week_start_date), md=buildMonthlyData(major.key), la=md.dailyLinanExpense*7,na=md.dailyNankeExpense*7;return {row,lm:marketingMultiple(row.linan_amount,la),nm:marketingMultiple(row.nanke_amount,na)};});
      const max=Math.max(1,...computed.flatMap(x=>[x.lm.value,x.nm.value]));

    // ===== 8. 銷售與行銷數據同步撈取 =====
    async function refreshData() {
      try {
        const [salesRes, mktRes] = await Promise.all([
          hubDb.from("sales_performance").select("*").eq("period_type", "weekly"),
          hubDb.from("marketing_expenses").select("*")
        ]);

        if (salesRes.error) throw salesRes.error;
        if (mktRes.error) throw mktRes.error;

        allSales = salesRes.data || [];
        allExpenses = mktRes.data || [];

        const keys = new Set();
        allSales.forEach(row => { 
          if (row.week_start_date) {
            const major = getMajorMonth(row.week_start_date);
            keys.add(major.key);
          } else if (row.year && row.month) {
            keys.add(`${row.year}-${String(row.month).padStart(2, "0")}`);
          }
        });
        allExpenses.forEach(row => { 
          if (row.year && row.month) {
            keys.add(`${row.year}-${String(row.month).padStart(2, "0")}`);
          }
        });
        
        allMonthKeys = Array.from(keys).sort().reverse();
      } catch (err) {
        console.error("載入數據失敗:", err);
        Swal.fire({ icon: "error", title: "資料載入失敗", text: err.message || "連線至 Supabase 發生問題", background: "#FFFFFF", color: "#1F1F1F" });
      }
    }

    // ===== 9. 加權分攤核心運算 =====
    function buildMonthlyData(key) {
      const [year, month] = key.split("-").map(Number);
      const days = getDaysInMonth(year, month);

      const expenses = allExpenses.filter(e => e.year === year && e.month === month);
      const totalExpense = expenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const dailyExpense = totalExpense / days;

      // 各筆支出獨立加權分攤
      let totalLinanExpense = 0, totalNankeExpense = 0;
      expenses.forEach(e => {
        const ratio = e.linan_ratio != null ? Number(e.linan_ratio) : 0.72;
        totalLinanExpense += Number(e.amount) * ratio;
        totalNankeExpense += Number(e.amount) * (1 - ratio);
      });

      const weeks = allSales.filter(s => s.week_start_date && getMajorMonth(s.week_start_date).key === key);
      // 月份與月份內週次都採「最新在上」；避免最新一週藏在月份底部。
      weeks.sort((a, b) => parseISODateLocal(b.week_start_date).getTime() - parseISODateLocal(a.week_start_date).getTime());

      return { 
        key, year, month, days, expenses, totalExpense, dailyExpense,
        totalLinanExpense, totalNankeExpense,
        dailyLinanExpense: totalLinanExpense / days, dailyNankeExpense: totalNankeExpense / days,
        weeks 
      };
    }

    function getLatestWeekStart() {
      const dates = allSales
        .filter(row => row.week_start_date)
        .map(row => row.week_start_date)
        .sort((a, b) => parseISODateLocal(b).getTime() - parseISODateLocal(a).getTime());
      return dates[0] || null;
    }

        salesSection.innerHTML = `
          <div>
            <div class="flex items-center gap-2.5">
              <i class="fas fa-chart-line text-blue-600"></i>
              <span class="text-base font-black text-slate-900">每週業績 × 行銷投入</span>
            </div>
            <p class="text-[13px] leading-6 text-slate-600 mt-1">最新一週固定在最上方；先看業績與行銷投入，再看「賺了多少倍」與成本佔比。</p>
          </div>`;

        if (mData.weeks.length === 0) {
          salesSection.innerHTML += `<p class="text-sm text-slate-600 italic py-2">無週業績數據（請在業績儀表板建立）。</p>`;
        } else {
          const list = document.createElement("div");
          list.className = "space-y-4";
          mData.weeks.forEach(row => {
            const s = parseISODateLocal(row.week_start_date), e = addDays(s, 6);
            const rangeText = `${s.getMonth() + 1}/${s.getDate()} ~ ${e.getMonth() + 1}/${e.getDate()}`;
            const isLatestWeek = latestWeekStart && row.week_start_date === latestWeekStart;
            const linanRev = Number(row.linan_amount || 0), nankeRev = Number(row.nanke_amount || 0);
            const linanWAlloc = mData.dailyLinanExpense * 7, nankeWAlloc = mData.dailyNankeExpense * 7;

            const getRatioUI = (rev, alloc) => {
              if (mData.totalExpense === 0) {
                return { ratioPct: 0, multiple: 0, isProf: false, status: "無支出", light: "text-slate-700 bg-slate-100 border-slate-300" };
              }
              const ratioPct = (alloc / (rev || 1)) * 100;
              const multiple = rev / (alloc || 1);
              const isProf = rev >= alloc;
              let light = "text-emerald-700 bg-emerald-50 border-emerald-300";
              let status = "安全";
              if (ratioPct >= 3 && ratioPct <= 10) {
                light = "text-amber-700 bg-amber-50 border-amber-300";
                status = "健康";
              } else if (ratioPct > 10) {
                light = "text-rose-700 bg-rose-50 border-rose-300";
                status = "預警";
              }
              return { ratioPct, multiple, isProf, light, status };
            };

            const l = getRatioUI(linanRev, linanWAlloc);
            const n = getRatioUI(nankeRev, nankeWAlloc);

            const buildStoreCard = (storeName, accent, bgClass, borderClass, revenue, alloc, ratioData, dailyNeed) => {
              const hasExpense = mData.totalExpense !== 0;
              const resultText = !hasExpense ? '--' : `${ratioData.isProf ? '賺' : '賠'} ${ratioData.multiple.toFixed(1)} 倍`;
              const resultColor = !hasExpense ? 'text-slate-700' : (ratioData.isProf ? 'text-emerald-700' : 'text-rose-700');
              return `
                <div class="rounded-2xl border ${borderClass} ${bgClass} p-4">
                  <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                    <div class="font-black text-slate-900 flex items-center gap-2 text-base"><span class="w-2.5 h-4 ${accent} rounded-full"></span> ${storeName}</div>
                    <span class="px-2.5 py-1 rounded-full text-[13px] border font-black ${ratioData.light}">${ratioData.status}</span>
                  </div>
                  <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                      <div class="text-[13px] text-slate-600 font-bold">週業績</div>
                      <div class="text-xl font-black text-slate-900 font-mono mt-1">${fmtTwd(revenue)}</div>
                    </div>
                    <div>
                      <div class="text-[13px] text-slate-600 font-bold">行銷投入</div>
                      <div class="text-xl font-black ${storeName === '臨安店' ? 'text-orange-700' : 'text-blue-700'} font-mono mt-1">${fmtTwd(alloc)}</div>
                    </div>
                  </div>
                  <div class="rounded-xl bg-white/90 border border-white p-3.5 flex flex-wrap items-end justify-between gap-3">
                    <div>
                      <div class="text-[13px] text-slate-600 font-bold">投入結果</div>
                      <div class="text-2xl font-black ${resultColor} font-mono mt-1">${resultText}</div>
                    </div>
                    <div class="text-left sm:text-right">
                      <div class="text-[13px] text-slate-600 font-bold">行銷佔營收</div>
                      <div class="text-lg font-black text-slate-800 font-mono mt-1">${!hasExpense ? '--' : ratioData.ratioPct.toFixed(1) + '%'}</div>
                    </div>
                  </div>
                  <div class="text-[13px] leading-6 text-slate-600 mt-3">日營業額至少需達 <strong class="text-slate-800 font-mono">${fmtTwd(dailyNeed)}</strong> 才能覆蓋行銷成本</div>
                </div>`;
            };

            const item = document.createElement("div");
            item.className = `bg-white/85 rounded-2xl p-4 sm:p-5 border shadow-sm ${isLatestWeek ? 'border-blue-300 ring-1 ring-blue-100' : 'border-slate-200'}`;
            item.innerHTML = `
              <div class="flex flex-wrap justify-between items-center gap-3 pb-3 mb-4 border-b border-slate-200">
                <div class="flex items-center gap-2.5 font-black text-slate-800 text-base">
                  <i class="far fa-clock text-blue-600"></i>
                  <span>${rangeText}</span>
                  ${isLatestWeek ? '<span class="px-2.5 py-1 rounded-full text-[13px] font-black bg-blue-600 text-white">最新一週</span>' : ''}
                </div>
                <span class="text-[13px] font-semibold text-slate-600">業績 → 投入 → 結果</span>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${buildStoreCard('臨安店', 'bg-orange-500', 'bg-orange-50/35', 'border-orange-200', linanRev, linanWAlloc, l, mData.dailyLinanExpense)}
                ${buildStoreCard('南科店', 'bg-blue-500', 'bg-blue-50/35', 'border-blue-200', nankeRev, nankeWAlloc, n, mData.dailyNankeExpense)}
              </div>
              <div class="text-[13px] leading-6 text-slate-600 mt-3">「賺／賠 X 倍」＝當週業績 ÷ 當週行銷分攤費用，用於快速判讀投入效率，並非實際淨利。</div>
            `;
            list.appendChild(item);
          });
          salesSection.appendChild(list);
        }
        // 行銷支出明細：一列看完「總金額 → 臨安負擔 → 南科負擔」，不重複上方分攤卡。
        const mktSection = document.createElement("section");
        mktSection.className = "rounded-2xl border border-orange-100 bg-orange-50/15 p-4 sm:p-5 space-y-4";
        let mktHeadHTML = `
          <div class="flex flex-wrap justify-between items-start gap-3">
            <div>
              <div class="flex items-center gap-2.5">
                <i class="fas fa-bullhorn text-orange-600"></i>
                <span class="text-base font-black text-slate-900">行銷支出明細</span>
                <span class="px-2.5 py-1 rounded-full text-[13px] bg-white text-slate-700 border border-slate-200 font-bold">${mData.expenses.length} 筆</span>
              </div>
              <p class="text-[13px] leading-6 text-slate-600 mt-1">每筆直接列出兩店負擔比例與實際金額，月底在最下方加總。</p>
            </div>
        `;
        if (isEditMode) {
          mktHeadHTML += `<button onclick="event.stopPropagation(); openExpenseModal(null, ${mData.year}, ${mData.month})" class="text-sm text-[#EA580C] font-bold bg-white px-3.5 py-2 rounded-lg border border-orange-200 hover:bg-orange-50 transition">+ 新增支出</button>`;
        }
        mktHeadHTML += `</div>`;
        mktSection.innerHTML = mktHeadHTML;

        if (mData.expenses.length === 0) {
          mktSection.innerHTML += `<p class="text-sm text-slate-600 italic py-2">尚未輸入任何支出數據。</p>`;
        } else {
          const list = document.createElement("div");
          list.className = "rounded-2xl overflow-hidden border border-slate-200 bg-white/90";

          // 桌面欄位標題，手機版隱藏。
          const colHead = document.createElement("div");
          colHead.className = "hidden md:grid md:grid-cols-[minmax(0,1.35fr)_minmax(180px,0.85fr)_minmax(180px,0.85fr)_72px] gap-0 bg-slate-50 border-b border-slate-200 text-[13px] font-black text-slate-700";
          colHead.innerHTML = `
            <div class="px-4 py-3">支出項目 / 總金額</div>
            <div class="px-5 py-3 border-l border-slate-200">臨安店負擔</div>
            <div class="px-5 py-3 border-l border-slate-200">南科店負擔</div>
            <div class="w-[72px]"></div>`;
          list.appendChild(colHead);

          mData.expenses.forEach(exp => {
            const ratio = exp.linan_ratio != null ? Number(exp.linan_ratio) : 0.72;
            const linanAmount = Number(exp.amount || 0) * ratio;
            const nankeAmount = Number(exp.amount || 0) * (1 - ratio);
            const row = document.createElement("div");
            row.className = "grid grid-cols-1 md:grid-cols-[minmax(0,1.35fr)_minmax(180px,0.85fr)_minmax(180px,0.85fr)_72px] gap-0 border-b last:border-b-0 border-slate-200";
            row.innerHTML = `
              <div class="px-4 py-4 min-w-0">
                <div class="text-[13px] text-slate-600 font-bold mb-1">支出項目</div>
                <div class="flex flex-wrap items-baseline gap-x-2 gap-y-1">
                  <span class="text-lg text-slate-900 font-black font-mono">${fmtTwd(exp.amount)}</span>
                  <span class="text-sm text-slate-700 font-semibold break-words">${exp.description || '無備註'}</span>
                </div>
              </div>
              <div class="px-4 py-4 md:px-5 md:border-l border-slate-200 bg-orange-50/25">
                <div class="text-sm text-orange-800 font-black">臨安店 <span class="font-mono">${Math.round(ratio*100)}%</span></div>
                <div class="text-lg text-orange-700 font-black font-mono mt-1">${fmtTwd(linanAmount)}</div>
              </div>
              <div class="px-4 py-4 md:px-5 md:border-l border-slate-200 bg-blue-50/25">
                <div class="text-sm text-blue-800 font-black">南科店 <span class="font-mono">${Math.round((1-ratio)*100)}%</span></div>
                <div class="text-lg text-blue-700 font-black font-mono mt-1">${fmtTwd(nankeAmount)}</div>
              </div>
              ${isEditMode ? `
                <div class="px-4 py-3 md:px-3 md:border-l border-slate-200 flex md:flex-col items-center justify-end md:justify-center gap-2 bg-slate-50/50">
                  <button onclick="event.stopPropagation(); editExpense('${exp.id}')" class="w-9 h-9 bg-white hover:bg-slate-100 rounded-full flex items-center justify-center text-slate-600 border border-slate-200" title="編輯"><i class="fas fa-pencil-alt text-sm"></i></button>
                  <button onclick="event.stopPropagation(); deleteExpense('${exp.id}', '${exp.amount}', '${exp.description}')" class="w-9 h-9 bg-white hover:bg-red-50 rounded-full flex items-center justify-center text-red-600 border border-red-200" title="刪除"><i class="fas fa-trash-alt text-sm"></i></button>
                </div>
              ` : '<div class="hidden md:block w-[1px]"></div>'}
            `;
            list.appendChild(row);
          });

          const linanSharePct = mData.totalExpense > 0 ? (mData.totalLinanExpense / mData.totalExpense * 100) : 0;
          const nankeSharePct = mData.totalExpense > 0 ? (mData.totalNankeExpense / mData.totalExpense * 100) : 0;
          const totalRow = document.createElement("div");
          totalRow.className = "grid grid-cols-1 md:grid-cols-[minmax(0,1.35fr)_minmax(180px,0.85fr)_minmax(180px,0.85fr)_72px] gap-0 bg-slate-50 border-t-2 border-slate-300";
          totalRow.innerHTML = `
            <div class="px-4 py-4">
              <div class="text-base font-black text-slate-900">本月分攤合計</div>
              <div class="text-[13px] text-slate-600 mt-1">共 ${mData.expenses.length} 筆支出</div>
            </div>
            <div class="px-4 py-4 md:px-5 md:border-l border-slate-300 bg-orange-50/50">
              <div class="text-sm font-black text-orange-800">臨安店合計 <span class="font-mono">${linanSharePct.toFixed(1)}%</span></div>
              <div class="text-xl font-black text-orange-700 font-mono mt-1">${fmtTwd(mData.totalLinanExpense)}</div>
            </div>
            <div class="px-4 py-4 md:px-5 md:border-l border-slate-300 bg-blue-50/50">
              <div class="text-sm font-black text-blue-800">南科店合計 <span class="font-mono">${nankeSharePct.toFixed(1)}%</span></div>
              <div class="text-xl font-black text-blue-700 font-mono mt-1">${fmtTwd(mData.totalNankeExpense)}</div>
            </div>
            <div class="hidden md:block w-[72px] md:border-l border-slate-300"></div>
          `;
          list.appendChild(totalRow);
          mktSection.appendChild(list);
        }

      // 儀表板閱讀順序：先看支出明細與分攤，再看每週業績 × 行銷投入。
      body.appendChild(mktSection);
      body.appendChild(salesSection);
      bodyClip.appendChild(body);
      bodyShell.appendChild(bodyClip);
      div.appendChild(bodyShell);
      return div;
    }

    // ===== 11. 儲存/新增/刪除業務函數 =====
    function openExpenseModal(id = null, defYear = null, defMonth = null) {
      if(!isHubOwner) return;
      dom.expenseModal.classList.remove("hidden");
      dom.expenseForm.reset();

      if (id) {
        dom.expenseModalTitle.textContent = "修改行銷支出";
        dom.editExpenseId.value = id;
        const item = allExpenses.find(e => e.id === id);
        if (item) {
          dom.inputYear.value = item.year; dom.inputMonth.value = item.month;
          dom.inputAmount.value = item.amount; dom.inputDescription.value = item.description || "";
          const linanRatioPct = item.linan_ratio != null ? Math.round(item.linan_ratio * 100) : 72;
          dom.inputLinanRatio.value = linanRatioPct; updateRatioDisplay(linanRatioPct);
        }
      } else {
        dom.expenseModalTitle.textContent = "新增行銷支出";
        dom.editExpenseId.value = "";
        if (defYear) dom.inputYear.value = defYear;
        if (defMonth) dom.inputMonth.value = defMonth;
        
        const targetYear = defYear || thisYear, targetMonth = defMonth || (new Date().getMonth() + 1);
        const linanRatioPct = Math.round(inheritRatio(targetYear, targetMonth) * 100);
        dom.inputLinanRatio.value = linanRatioPct; updateRatioDisplay(linanRatioPct);
      }
    }

    function closeExpenseModal() { dom.expenseModal.classList.add("hidden"); }

    async function handleExpenseSubmit(e) {
      e.preventDefault();
      if(!isHubOwner) return;
      try {
        const id = dom.editExpenseId.value.trim();
        const year = parseInt(dom.inputYear.value), month = parseInt(dom.inputMonth.value);
        const amount = Number(dom.inputAmount.value), description = dom.inputDescription.value.trim();
        const ratio = parseFloat(dom.inputLinanRatio.value) / 100;

        if (isNaN(amount) || amount <= 0) {
          Swal.fire({ icon: "warning", title: "請輸入有效金額", background: "#FFFFFF", color: "#1F1F1F" }); return;
        }

        const payload = { year, month, amount, description, linan_ratio: ratio };

        let res;
        if (id) {
          res = await hubDb.from("marketing_expenses").update(payload).eq("id", id);
          if (res.error) throw res.error;
          await writeLog("修改", `修改 ${year}/${month}月 支出: $${amount} (臨安 ${Math.round(ratio*100)}%), 備註: ${description}`);
        } else {
          res = await hubDb.from("marketing_expenses").insert([payload]);
          if (res.error) throw res.error;
          await writeLog("新增", `新增 ${year}/${month}月 支出: $${amount} (臨安 ${Math.round(ratio*100)}%), 備註: ${description}`);
        }

        closeExpenseModal();
        Swal.fire({ icon: "success", title: "儲存成功", timer: 800, showConfirmButton: false, background: "#FFFFFF", color: "#1F1F1F" });
        await refreshData();
        renderAll();
      } catch (err) {
        console.error("儲存失敗:", err);
        Swal.fire({ icon: "error", title: "儲存失敗", text: err.message || "資料庫寫入受阻，請檢查欄位結構！", background: "#FFFFFF", color: "#1F1F1F" });
      }
    }

    function editExpense(id) { if(!isHubOwner) return; openExpenseModal(id); }

    async function deleteExpense(id, amount, desc) {
      if(!isHubOwner) return;
      const confirm = await Swal.fire({
        title: "確認刪除此筆支出？", text: `金額：${fmtTwd(amount)} (${desc})`, icon: "warning",
        showCancelButton: true, confirmButtonColor: "#ef4444", cancelButtonColor: "#64748B", confirmButtonText: "確定刪除", background: "#FFFFFF", color: "#1F1F1F"
      });

      if (confirm.isConfirmed) {
        try {
          const res = await hubDb.from("marketing_expenses").delete().eq("id", id);
          if (res.error) throw res.error;
          await writeLog("刪除", `刪除支出: $${amount} (${desc})`);
          Swal.fire({ icon: "success", title: "已刪除", timer: 800, showConfirmButton: false, background: "#FFFFFF", color: "#1F1F1F" });
          await refreshData();
          renderAll();
        } catch (err) {
          Swal.fire({ icon: "error", title: "刪除失敗", text: err.message, background: "#FFFFFF", color: "#1F1F1F" });
        }
      }
    }

    async function writeLog(action, details) {
      if(!isHubOwner) return;
      try { await hubDb.from("marketing_logs").insert([{ action, details }]); } 
      catch (err) { console.error("日誌寫入失敗:", err); }
    }

    async function openLogsModal() {
      dom.logsModal.classList.remove("hidden");
      dom.logsContainer.innerHTML = `<div class="text-xs text-slate-500 py-4"><i class="fas fa-spinner fa-spin mr-1"></i> 讀取紀錄中...</div>`;
      try {
        const { data, error } = await hubDb.from("marketing_logs").select("*").order("created_at", { ascending: false }).limit(40);
        if (error) throw error;

        if(!data || data.length === 0) {
          dom.logsContainer.innerHTML = `<p class="text-xs text-slate-400 italic py-4">目前無任何日誌紀錄。</p>`; return;
        }

        let html = `<div class="space-y-2">`;
        data.forEach(log => {
          const timeStr = new Date(log.created_at).toLocaleString("zh-TW", { hour12: false });
          let badge = "bg-slate-100 text-slate-600";
          if(log.action === "新增") badge = "bg-emerald-50 text-emerald-600 border border-emerald-200";
          if(log.action === "修改") badge = "bg-amber-50 text-amber-600 border border-amber-200";
          if(log.action === "刪除") badge = "bg-rose-50 text-rose-600 border border-rose-200";

          html += `
            <div class="bg-white/60 p-3 rounded-xl border border-slate-100 text-xs">
              <div class="flex items-center justify-between mb-1">
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${badge}">${log.action}</span>
                <span class="text-slate-400 text-[10px] font-mono">${timeStr}</span>
              </div>
              <p class="text-slate-600 font-medium">${log.details}</p>
            </div>
          `;
        });
        html += `</div>`; dom.logsContainer.innerHTML = html;
      } catch (err) {
        dom.logsContainer.innerHTML = `<p class="text-xs text-red-500 p-4">載入失敗: ${err.message}</p>`;
      }
    }

    function closeLogsModal() { dom.logsModal.classList.add("hidden"); }

    (async()=>{ if(await __initHubPageAccess()) await initApp(); })();
  </script>
</body>
</html>
